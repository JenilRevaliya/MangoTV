<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F24" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5E00" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Remote Silhouette -->
  <rect x="156" y="76" width="200" height="360" rx="48" fill="#151518" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- D-Pad Clickwheel -->
  <circle cx="256" cy="180" r="54" fill="#202026" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <circle cx="256" cy="180" r="22" fill="#2A2A32" />
  
  <!-- Mango Leaf Accent -->
  <path d="M 256 122 C 262 110, 274 104, 280 106 C 282 116, 274 126, 256 128 Z" fill="url(#mangoGrad)" />
  
  <!-- Utility Buttons -->
  <circle cx="216" cy="272" r="16" fill="#24242C" />
  <circle cx="296" cy="272" r="16" fill="#24242C" />
  
  <circle cx="216" cy="324" r="16" fill="#24242C" />
  <circle cx="296" cy="324" r="16" fill="#24242C" />
  
  <!-- Volume Rocker Pill -->
  <rect x="240" y="360" width="32" height="56" rx="16" fill="#202026" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
</svg>
